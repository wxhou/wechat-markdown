name: Desktop Release

# push tag (vX.Y.Z) → 三平台构建桌面安装包并上传 GitHub Releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Delete stale release assets (rerun-safe re-upload)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 首次发版时 Release 尚不存在，gh api 会把 404 的 JSON 错误体打到 stdout，
          # 按纯数字过滤才不会把错误体当 ID 用（否则拼出的 URL 无法解析，整步退出码 1）
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null | grep -E '^[0-9]+$' || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
              --jq '.[].name' | while read -r name; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$(
                gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name==\"$name\") | .id")" >/dev/null 2>&1 || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '公众号排版 v__VERSION__'
          releaseBody: '桌面版安装包（macOS / Windows / Linux）。macOS 未签名，首次打开请右键 → 打开。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
